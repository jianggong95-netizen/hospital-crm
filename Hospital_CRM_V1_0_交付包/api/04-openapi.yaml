      type: object
      properties:
        code: { type: string }
        data:
          type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditLogItem" } }
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
