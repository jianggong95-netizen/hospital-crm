  /memberships/cards/{cardId}:
    get:
      tags: [Memberships]
      summary: 次卡详情（含扣次记录）
      x-required-permission: crm:member:read
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberCardDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /memberships/cards/{cardId}/consumptions:
    post:
      tags: [Memberships]
      summary: 次卡扣次
      description: 条件更新（remaining_times >= times）保证并发扣次不超扣；每次扣次写扣次记录与会员账本。
      x-required-permission: crm:member:write
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [times]
              properties:
                times: { type: integer, minimum: 1 }
                bizType: { type: string, maxLength: 32, nullable: true }
                bizNo: { type: string, maxLength: 64, nullable: true }
                remark: { type: string, maxLength: 500, nullable: true }
      responses:
        "200":
          description: 扣次成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberCard" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /memberships/cards/{cardId}/refunds:
    post:
      tags: [Memberships]
      summary: 次卡返还次数
      description: 指定扣次记录时将该记录置 REFUNDED，重复返返回 422；返还后回补剩余次数并写账本。
