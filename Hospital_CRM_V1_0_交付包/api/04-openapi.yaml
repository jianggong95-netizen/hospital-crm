openapi: 3.1.0
info:
  title: Hospital CRM API
  version: 1.0.0
  description: 医院智慧客户服务与运营管理平台标准API基线。生产环境需补充医院确认的字段映射、权限和渠道回调协议。
servers:
  - url: https://crm.example.intranet/api/v1
    description: 医院内网示例地址，部署时替换
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: System
  - name: Customers
  - name: Families
  - name: HIS
  - name: Operation
  - name: Appointment
  - name: Escort
  - name: HomeVisit
  - name: Service
  - name: Orders
  - name: Followups
  - name: Chat
  - name: Complaints
  - name: Insurance
paths:
  /customers:
    get:
      tags: [Customers]
      summary: 分页查询客户
      parameters:
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCustomerResponse" }
    post:
      tags: [Customers]
      summary: 创建CRM客户档案
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /customers/{customerId}:
    get:
      tags: [Customers]
      summary: 获取客户详情
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: 客户详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /customers/{customerId}/360:
    get:
      tags: [Customers]
      summary: 获取患者/客户360聚合视图
      description: |
        以 CRM 客户为主键聚合客户档案、标签、家庭归属与 HIS 诊疗摘要。
        每个分区独立返回来源、状态、获取时间与有效期；HIS 不可用时返回 UNAVAILABLE
        或带 STALE 标记的缓存快照，不补齐、不推测、不伪造诊疗数据。
      x-required-permission: crm:patient360:read
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - in: query
          name: include
          description: 允许的聚合分区；未提供时返回全部已交付分区。分区仍需逐项授权。
          schema:
            type: array
            items:
              type: string
              enum: [visits, admissions, appointments, serviceOrders, followups, memberships, complaints]
          style: form
          explode: false
        - in: query
          name: visitPage
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: visitPageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: admissionPage
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: admissionPageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: refresh
          description: 为 true 时跳过患者360的短时 HIS 缓存，但仍受 CRM-005 快照降级策略约束
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 360视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer360Response" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /families:
    get:
      tags: [Families]
      summary: 分页查询家庭账户
      parameters:
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [active, disabled] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyPageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Families]
      summary: 创建家庭账户
      description: 家庭管理员客户自动建立本人关系；同一客户同一时段默认只允许一个有效家庭。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyDetailResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /families/{familyId}:
    get:
      tags: [Families]
      summary: 家庭账户详情
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyDetailResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /families/{familyId}/members:
    get:
      tags: [Families]
      summary: 家庭成员与关系历史
      description: includeEnded=true 时返回已解除关系，用于关系历史追溯。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - in: query
          name: includeEnded
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMemberListResponse" }
    post:
      tags: [Families]
      summary: 添加家庭成员
      description: 家庭关系仅表达家庭归属，不授予病历或临床数据访问权限。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyMemberCreate" }
      responses:
        "200":
          description: 添加成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMemberResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /families/{familyId}/members/{memberId}:
    put:
      tags: [Families]
      summary: 更新家庭成员关系或管理员
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyMemberUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMemberResponse" }
    delete:
      tags: [Families]
      summary: 解除家庭成员关系
      description: 逻辑结束关系并保留历史记录，同时撤销该成员全部生效中的代办授权。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /families/{familyId}/members/{memberId}/authorizations:
    get:
      tags: [Families]
      summary: 查询成员代办授权
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationListResponse" }
    post:
      tags: [Families]
      summary: 创建代办授权
      description: 代办范围仅限 appointment/payment/package_share/profile_update，病历与临床数据不可授权。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyAuthorizationCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResponse" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /families/{familyId}/members/{memberId}/authorizations/{authorizationId}:
    delete:
      tags: [Families]
      summary: 撤销代办授权
      description: 撤销后该授权立即失效，后续代办接口必须拒绝访问。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/MemberId"
        - in: path
          name: authorizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 撤销成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResponse" }
  /families/{familyId}/delegation-checks:
    post:
      tags: [Families]
      summary: 代办权限校验
      description: 供预约、支付等代办接口受理前调用；授权撤销、过期、关系解除或家庭停用时返回 403。
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegationCheckRequest" }
      responses:
        "200":
          description: 校验通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationCheckResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /his/patients/search:
    get:
      tags: [HIS]
      summary: 查询HIS患者候选记录
      description: 只读查询；仅返回脱敏后的最小字段，候选必须人工核验后才能绑定到CRM客户。
      x-required-permission: his:patient:read
      parameters:
        - in: query
          name: keyword
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - in: query
          name: identityType
          description: 省略时按关键字自动推断手机号/证件号，否则按通用关键字检索。
          schema: { type: string, enum: [mobile, id_no, his_patient_id, mrn] }
      responses:
        "200":
          description: 候选列表；需遵循最小化返回和人工核验原则
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HisPatientSearchResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /his/patients/{externalPatientId}/360:
    get:
      tags: [HIS]
      summary: 获取HIS患者360摘要
      description: HIS不可用且存在未过期快照时返回 STALE 数据，并明确标记来源、获取时间与有效期；不伪造数据。
      x-required-permission: his:patient:read
      parameters:
        - in: path
          name: externalPatientId
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: HIS聚合摘要（LIVE）或降级快照（STALE）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/His360Response" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /his/patients/{externalPatientId}/link:
    post:
      tags: [HIS]
      summary: 人工核验后绑定HIS患者主索引
      description: 仅允许已核验的HIS患者绑定到CRM客户；同一外部标识只能绑定一个客户。
      x-required-permission: his:patient:link
      parameters:
        - in: path
          name: externalPatientId
          required: true
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HisPatientLinkRequest" }
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HisPatientLinkResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /his/sync-logs:
    get:
      tags: [HIS]
      summary: 分页查询HIS同步日志
      description: 用于查询审计与运维排障；不返回查询关键字等敏感明文。
      x-required-permission: his:patient:read
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [SUCCESS, FAILED, DEGRADED] }
        - in: query
          name: operation
          schema: { type: string, maxLength: 80 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 同步日志分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HisSyncLogPageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /service-catalog:
    get:
      tags: [Service]
      summary: 查询可预约服务目录
      parameters:
        - in: query
          name: serviceType
          schema: { type: string, enum: [escort, home_service] }
      responses:
        "200":
          description: 服务目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCatalogResponse" }
  /staff/availability:
    get:
      tags: [Service]
      summary: 查询服务人员可用时段
      parameters:
        - in: query
          name: serviceCode
          required: true
          schema: { type: string }
        - in: query
          name: startAt
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: durationMinutes
          required: true
          schema: { type: integer, minimum: 30, maximum: 1440 }
      responses:
        "200":
          description: 可用人员与时段
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
  /service-orders:
    post:
      tags: [Service]
      summary: 创建陪诊或上门服务订单
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceOrderCreate" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOrderResponse" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /service-orders/{serviceOrderId}/accept:
    post:
      tags: [Service]
      summary: 服务人员接单
      parameters:
        - in: path
          name: serviceOrderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 接单成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOrderResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /service-orders/{serviceOrderId}/complete:
    post:
      tags: [Service]
      summary: 完成服务
      parameters:
        - in: path
          name: serviceOrderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completionNote]
              properties:
                completionNote: { type: string, maxLength: 4000 }
                patientConfirmed: { type: boolean, default: false }
      responses:
        "200":
          description: 服务完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOrderResponse" }
  /memberships/levels:
    get:
      tags: [Memberships]
      summary: 会员等级列表
      x-required-permission: crm:member:read
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MemberLevel" }
  /memberships/accounts:
    get:
      tags: [Memberships]
      summary: 会员账户分页查询
      x-required-permission: crm:member:read
      parameters:
        - in: query
          name: keyword
          required: false
          schema: { type: string }
          description: 账户号模糊匹配
        - in: query
          name: level
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [active, disabled] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MemberAccount" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
    post:
      tags: [Memberships]
      summary: 开通会员账户
      x-required-permission: crm:member:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, format: uuid }
      responses:
        "200":
          description: 开户成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberAccount" }
        "409": { $ref: "#/components/responses/Conflict" }
  /memberships/accounts/{accountId}:
    get:
      tags: [Memberships]
      summary: 会员账户详情（含有效次卡）
      x-required-permission: crm:member:read
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberAccountDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /memberships/accounts/{accountId}/ledger:
    get:
      tags: [Memberships]
      summary: 会员账本
      description: 余额与积分每次变动一条记录，含变动前后快照，支持按账期追溯。
      x-required-permission: crm:member:read
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MemberLedgerEntry" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
  /memberships/recharges:
    post:
      tags: [Memberships]
      summary: 会员充值
      description: 条件更新累加余额并写 RECHARGE 账本；账户停用返回 422。
      x-required-permission: crm:member:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, amount]
              properties:
                accountId: { type: string, format: uuid }
                amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
                orderId: { type: string, format: uuid, nullable: true }
                reason: { type: string, maxLength: 200, nullable: true }
      responses:
        "200":
          description: 充值成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberAccount" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /memberships/consumptions:
    post:
      tags: [Memberships]
      summary: 会员余额消费
      description: 余额扣减使用条件更新（balance >= amount），并发消费不会超扣；允许共享时可由已授权家庭成员账户代付。
      x-required-permission: crm:member:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount]
              properties:
                customerId: { type: string, format: uuid }
                amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
                bizType: { type: string, maxLength: 32, nullable: true }
                bizNo: { type: string, maxLength: 64, nullable: true }
                allowShared: { type: boolean, default: false }
      responses:
        "200":
          description: 消费成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberAccount" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /memberships/points/adjustments:
    post:
      tags: [Memberships]
      summary: 积分调整
      description: 正数增加、负数扣减；扣减条件更新（points >= delta），积分变动后按门槛自动升级等级。
      x-required-permission: crm:member:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
