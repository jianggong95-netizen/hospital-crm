      responses:
        "200":
          description: 购买成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberPurchaseResult" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /memberships/cards:
