  /orders:
    get:
      tags: [Orders]
      summary: 订单分页查询
      description: 金额一律由服务端按订单项重算，支持按订单号、状态、客户与创建日期过滤。
      x-required-permission: crm:order:read
      parameters:
        - in: query
          name: keyword
          required: false
          schema: { type: string }
          description: 订单号模糊匹配
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [CREATED, PAID, COMPLETED, CANCELLED, PARTIAL_REFUNDED, REFUNDED] }
        - in: query
          name: customerId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: dateFrom
          required: false
          schema: { type: string, format: date }
        - in: query
          name: dateTo
          required: false
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
    post:
      tags: [Orders]
      summary: 创建CRM收费订单
      description: 服务端按 数量×单价 重算行金额与订单总额，优惠不得超过总额；幂等键重复返回 409。CRM 仅记录 CRM 主库资金流水，不写 HIS 收费表。
      x-required-permission: crm:order:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "200":
          description: 订单创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: 订单详情
      x-required-permission: crm:order:read
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{orderId}/cancel:
    put:
      tags: [Orders]
      summary: 取消未支付订单
      description: 仅 CREATED 且实付为 0 可取消；已支付订单须走退款流程（422）。
      x-required-permission: crm:order:write
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /orders/{orderId}/complete:
    put:
      tags: [Orders]
      summary: 完成已支付订单
      x-required-permission: crm:order:write
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 完成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /orders/{orderId}/payments:
    post:
      tags: [Orders]
      summary: 发起支付
      description: 支付金额必须大于 0 且不超过订单未付余额；幂等键重复返回 409。渠道由 PaymentGateway 抽象接入。
      x-required-permission: crm:order:write
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, amount, idempotencyKey]
              properties:
                channel: { type: string, enum: [wechat, alipay, bank, cash, other] }
                amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
                idempotencyKey: { type: string, maxLength: 100 }
      responses:
        "200":
          description: 支付单创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Payment" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /payments:
    get:
      tags: [Orders]
      summary: 支付单分页查询
      x-required-permission: crm:order:read
      parameters:
        - in: query
          name: keyword
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PROCESSING, SUCCESS, FAILED, CLOSED] }
        - in: query
          name: channel
          required: false
          schema: { type: string, enum: [wechat, alipay, bank, cash, other] }
        - in: query
          name: orderId
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
  /payments/{paymentId}:
    get:
      tags: [Orders]
      summary: 支付状态
      x-required-permission: crm:order:read
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/{paymentId}/refunds:
    post:
      tags: [Orders]
      summary: 申请退款
      description: 仅 SUCCESS 支付单可退款；金额不得超过 数量−累计已退（支持部分退款）。
      x-required-permission: crm:order:write
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundApply" }
      responses:
        "200":
          description: 退款申请成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Refund" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /payment-callbacks/{channel}:
    post:
      tags: [Orders]
      summary: 支付渠道回调
      description: 免登录但强制 HMAC-SHA256 验签（失败 401）；同一支付单同一渠道交易号的重复回调按幂等回放，不重复入账。
      security: []
      parameters:
        - in: path
          name: channel
          required: true
          schema: { type: string, enum: [wechat, alipay, bank, cash, other] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCallback" }
      responses:
        "200":
          description: 回调处理结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PaymentCallbackResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /refunds:
    get:
      tags: [Orders]
      summary: 退款单分页查询
      x-required-permission: crm:payment:read
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, SUCCESS, FAILED] }
        - in: query
          name: orderId
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
  /refunds/{refundId}:
    get:
      tags: [Orders]
      summary: 退款单详情
      x-required-permission: crm:payment:read
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Refund" }
        "404": { $ref: "#/components/responses/NotFound" }
  /refunds/{refundId}/approve:
    put:
      tags: [Orders]
      summary: 审核通过并执行退款
      description: 支付单与订单退款金额以条件更新原子累加，并发超退返回 422 并整体回滚。
      x-required-permission: crm:payment:manage
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 退款执行结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Refund" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /refunds/{refundId}/reject:
    put:
      tags: [Orders]
      summary: 驳回购退款
      x-required-permission: crm:payment:manage
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: 驳回成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Refund" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /reconciliations:
    get:
      tags: [Orders]
      summary: 对账批次分页查询
      x-required-permission: crm:payment:read
      parameters:
        - in: query
          name: channel
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [RUNNING, MATCHED, DIFF, FAILED] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReconciliationBatch" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
    post:
      tags: [Orders]
      summary: 执行渠道对账
      description: 按渠道与账期比对本地成功支付与渠道账单（ChannelStatementProvider 抽象），生成批次与差异明细；全部一致为 MATCHED，否则 DIFF。
      x-required-permission: crm:payment:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, reconcileDate]
