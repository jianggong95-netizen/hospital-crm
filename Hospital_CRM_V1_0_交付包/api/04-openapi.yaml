      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: 状态已更新 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/users/{userId}/reset-password:
    post:
      tags: [System]
      summary: 重置用户密码
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200": { description: 密码已重置，该用户全部刷新令牌失效 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/orgs/tree:
    get:
      tags: [System]
      summary: 查询组织树
      description: 需要 system:org:read；非全院数据范围仅返回可见组织及其祖先。
      responses:
        "200":
          description: 组织树
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTreeResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/orgs:
    post:
      tags: [System]
      summary: 创建组织
      description: 需要 system:org:write；只能在数据范围内组织下创建。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgCreate" }
      responses:
        "200": { description: 创建成功 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /system/orgs/{orgId}:
    put:
      tags: [System]
      summary: 更新组织
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgUpdate" }
      responses:
        "200": { description: 更新成功 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /system/roles:
    get:
      tags: [System]
      summary: 查询角色列表
      description: 需要 system:role:read。
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [System]
      summary: 创建角色
      description: 需要 system:role:write；不能授予超出自身权限的权限项。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /system/roles/{roleId}:
    put:
      tags: [System]
      summary: 更新角色
      description: 内置 SUPER_ADMIN 角色不允许修改。
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /system/permissions:
    get:
      tags: [System]
      summary: 查询权限字典
      description: 需要 system:permission:read；按模块分组返回。
      responses:
        "200":
          description: 权限分组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionGroupListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/audit-logs:
    get:
      tags: [System]
      summary: 分页查询审计日志
      description: 需要 system:audit:read；按当前用户数据范围过滤操作人所属组织。
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: action
          schema: { type: string, maxLength: 80 }
        - in: query
          name: resourceType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: actorUserId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageAuditLogResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /customers:
    get:
      tags: [Customers]
      summary: 分页查询客户档案
      description: 需要 crm:customer:read；手机号/证件号仅返回脱敏值，检索手机号或证件号时按 HMAC 哈希精确匹配。
      parameters:
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
          description: 姓名/客户号模糊匹配；11 位手机号或 15/18 位身份证号按哈希精确匹配
        - in: query
          name: tagId
          schema: { type: string, format: uuid }
        - in: query
          name: sourceCode
          schema: { type: string, maxLength: 32 }
        - in: query
          name: status
          schema: { type: string, enum: [active, disabled] }
        - in: query
          name: gender
          schema: { type: string, enum: [unknown, male, female] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCustomerResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      summary: 创建客户档案
      description: 需要 crm:customer:write；手机号与证件号加密存储并计算检索哈希，重复时返回 409，可显式强制创建。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "200":
          description: 创建成功，响应仅包含脱敏字段
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummaryResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /customers/{customerId}:
    get:
      tags: [Customers]
      summary: 查询客户档案详情
      description: 需要 crm:customer:read；拥有 crm:customer:sensitive:read 时返回解密后的完整手机号与证件号，并写入敏感查看审计。
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerDetailResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Customers]
      summary: 更新客户档案
      description: 需要 crm:customer:write；phone/idNo 传空字符串表示清空，缺省表示保持不变。
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummaryResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /customers/{customerId}/status:
    patch:
      tags: [Customers]
      summary: 启用或停用客户档案
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: 状态已更新 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tags:
    get:
      tags: [Customers]
      summary: 查询客户标签字典
      description: 需要 crm:tag:read。
      parameters:
        - in: query
          name: includeDisabled
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      summary: 创建客户标签
      description: 需要 crm:tag:write。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagItemResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tags/{tagId}:
    put:
      tags: [Customers]
      summary: 更新客户标签
      description: 需要 crm:tag:write；停用标签不再可用于新分配。
      parameters:
        - in: path
          name: tagId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagItemResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operation/channels:
    get:
      tags: [Operation]
      summary: 查询来源渠道
      x-required-permission: crm:channel:read
      parameters:
        - in: query
          name: includeDisabled
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 渠道列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OperationChannel" }
    post:
      tags: [Operation]
      summary: 创建来源渠道
      x-required-permission: crm:channel:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelCode, channelName]
              properties:
                channelCode: { type: string, pattern: "^[A-Z0-9_]{2,64}$" }
                channelName: { type: string, maxLength: 100 }
                channelType:
                  type: string
                  enum: [online, offline, referral, activity, his, other]
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationChannel" }
  /operation/channels/{channelId}/status:
    put:
      tags: [Operation]
      summary: 启停来源渠道
      x-required-permission: crm:channel:write
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationChannel" }
  /operation/leads:
    get:
      tags: [Operation]
      summary: 分页查询线索
      x-required-permission: crm:lead:read
      parameters:
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [NEW, CONTACTING, QUALIFIED, INVITED, CONVERTED, INVALID, MERGED] }
        - in: query
          name: channelCode
          schema: { type: string, maxLength: 64 }
        - in: query
          name: ownerUserId
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 线索分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/OperationLead" }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      totalPages: { type: integer }
    post:
      tags: [Operation]
      summary: 创建线索
      description: |
        手机号/证件号重复时返回 409 与疑似重复线索号；确认非同一人时传 forceCreate=true。
        线索敏感字段仅返回脱敏值。
      x-required-permission: crm:lead:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sourceChannelCode]
              properties:
                name: { type: string, maxLength: 100 }
                gender: { type: string, enum: [unknown, male, female] }
                birthDate: { type: string, format: date }
                phone: { type: string, maxLength: 32 }
                idNo: { type: string, maxLength: 32 }
                sourceChannelCode: { type: string, maxLength: 64 }
                ownerUserId: { type: string, format: uuid }
                remark: { type: string, maxLength: 1000 }
                forceCreate: { type: boolean, default: false }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLead" }
        "409": { $ref: "#/components/responses/Conflict" }
  /operation/leads/duplicates:
    get:
      tags: [Operation]
      summary: 重复线索核验
      x-required-permission: crm:lead:read
      parameters:
        - in: query
          name: phone
          schema: { type: string }
        - in: query
          name: idNo
          schema: { type: string }
      responses:
        "200":
          description: 疑似重复线索
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OperationDuplicateLead" }
  /operation/leads/assignees:
    get:
      tags: [Operation]
      summary: 查询可分派员工
      x-required-permission: crm:lead:read
      parameters:
        - in: query
          name: keyword
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: 可分派员工
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OperationAssignee" }
  /operation/leads/{leadId}:
    get:
      tags: [Operation]
      summary: 线索详情
      x-required-permission: crm:lead:read
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: 线索详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLeadDetail" }
    put:
      tags: [Operation]
      summary: 编辑线索
      x-required-permission: crm:lead:write
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                gender: { type: string, enum: [unknown, male, female] }
                birthDate: { type: string, format: date }
                phone: { type: string, maxLength: 32 }
                idNo: { type: string, maxLength: 32 }
                sourceChannelCode: { type: string, maxLength: 64 }
                ownerUserId: { type: string, format: uuid }
                remark: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLead" }
  /operation/leads/{leadId}/status:
    put:
      tags: [Operation]
      summary: 线索状态流转
      description: 允许 NEW→CONTACTING→QUALIFIED→INVITED；CONVERTED 与 MERGED 只能通过转化/合并接口产生。
      x-required-permission: crm:lead:write
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [CONTACTING, QUALIFIED, INVITED, INVALID] }
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLead" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /operation/leads/{leadId}/convert:
    post:
      tags: [Operation]
      summary: 线索转客户
      description: 可创建新客户或关联既有客户；写入 crm_lead_conversion，保留线索号与客户号追溯。
      x-required-permission: crm:lead:convert
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { type: string, format: uuid }
                createCustomer: { type: boolean, default: true }
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 转化成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationConversion" }
        "409": { $ref: "#/components/responses/Conflict" }
  /operation/leads/{leadId}/merge:
    post:
      tags: [Operation]
      summary: 合并线索
      description: 当前线索标记 MERGED 并指向目标线索，不复制敏感字段。
      x-required-permission: crm:lead:write
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetLeadId]
              properties:
                targetLeadId: { type: string, format: uuid }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 合并成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLead" }
  /operation/leads/{leadId}/assign:
    post:
      tags: [Operation]
      summary: 线索分派/转派
      x-required-permission: crm:lead:assign
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId: { type: string, format: uuid }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 分派成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationLead" }
  /operation/leads/{leadId}/contacts:
    get:
      tags: [Operation]
      summary: 线索联系记录
      x-required-permission: crm:lead:read
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 联系记录分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/OperationContactRecord" }
                      total: { type: integer }
    post:
      tags: [Operation]
      summary: 新增联系记录
      x-required-permission: crm:lead:write
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactType, content, resultCode]
              properties:
                contactType: { type: string, enum: [phone, wechat, sms, visit, other] }
                contactedAt: { type: string, format: date-time }
                content: { type: string, maxLength: 2000 }
                resultCode:
                  type: string
                  enum: [CONNECTED, NO_ANSWER, REFUSED, INTERESTED, CONVERTED, OTHER]
                nextFollowUpAt: { type: string, format: date-time }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationContactRecord" }
  /operation/leads/{leadId}/conversion:
    get:
      tags: [Operation]
      summary: 线索转化记录
      x-required-permission: crm:lead:read
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: 转化记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OperationConversion" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operation/leads/{leadId}/assignments:
    get:
      tags: [Operation]
      summary: 线索分派历史
      x-required-permission: crm:lead:read
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: 分派历史
          content:
            application/json:
