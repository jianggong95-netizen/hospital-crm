        levelName: { type: string }
        minPoints: { type: integer, format: int64 }
        discountRate: { type: string, description: "十进制折扣率字符串" }
        sortNo: { type: integer }
    MemberAccount:
      type: object
      description: 会员账户；余额与积分变动一律经账本记录。
      properties:
        id: { type: string, format: uuid }
        accountNo: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string, nullable: true }
        memberLevel: { type: string }
        levelName: { type: string, nullable: true }
        discountRate: { type: string, nullable: true }
        balance: { type: string, description: "可用余额（十进制字符串）" }
        frozenBalance: { type: string }
        points: { type: integer, format: int64 }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemberCardSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        cardNo: { type: string }
        packageCode: { type: string }
        packageName: { type: string, nullable: true }
        totalTimes: { type: integer }
        usedTimes: { type: integer }
        remainingTimes: { type: integer }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, EXHAUSTED, EXPIRED, VOID] }
    MemberAccountDetail:
      type: object
      properties:
        account: { $ref: "#/components/schemas/MemberAccount" }
        cards:
          type: array
          description: 该账户客户的有效次卡
          items: { $ref: "#/components/schemas/MemberCardSummary" }
    MemberLedgerEntry:
      type: object
      description: 会员账本条目；ledgerType 含 RECHARGE/CONSUME/POINTS_ADJUST/PACKAGE_PURCHASE/CARD_CONSUME/CARD_REFUND/REFUND_REVERSAL/CARD_VOID_ON_REFUND。
      properties:
        id: { type: string, format: uuid }
        ledgerType: { type: string }
        amount: { type: string, description: "余额变动，正增负减" }
        pointsDelta: { type: integer, format: int64 }
        balanceAfter: { type: string, nullable: true }
        pointsAfter: { type: integer, format: int64, nullable: true }
        relatedOrderId: { type: string, format: uuid, nullable: true }
        bizNo: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    MemberRefundReversalResult:
      type: object
      description: 订单退款后的会员权益返还结果。
      properties:
        orderId: { type: string, format: uuid }
        balanceReversed: { type: string }
        pointsReversed: { type: integer, format: int64 }
        cardsVoided: { type: integer }
        cardTimesReturned: { type: integer }
    MemberPackage:
      type: object
      description: 会员套餐；packageType 为 TIMES/BALANCE/POINTS，载荷字段按类型生效。
      properties:
        packageCode: { type: string }
        packageName: { type: string }
        packageType: { type: string, enum: [TIMES, BALANCE, POINTS] }
        price: { type: string }
        times: { type: integer, nullable: true }
        balanceAmount: { type: string, nullable: true }
        pointsAmount: { type: integer, format: int64, nullable: true }
        validDays: { type: integer, nullable: true }
        status: { type: string, enum: [active, disabled] }
        description: { type: string, nullable: true }
    MemberPackageCreate:
      type: object
      required: [packageCode, packageName, packageType, price]
      properties:
        packageCode: { type: string, pattern: "^[A-Za-z0-9_]{2,32}$" }
        packageName: { type: string, maxLength: 120 }
        packageType: { type: string, enum: [TIMES, BALANCE, POINTS] }
        price: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        times: { type: integer, minimum: 1, nullable: true, description: "TIMES 套餐必填" }
        balanceAmount: { type: string, nullable: true, description: "BALANCE 套餐必填" }
        pointsAmount: { type: integer, format: int64, nullable: true, description: "POINTS 套餐必填" }
        validDays: { type: integer, minimum: 1, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }
    MemberPackageUpdate:
      type: object
      required: [packageName, price]
      properties:
        packageName: { type: string, maxLength: 120 }
        price: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        times: { type: integer, minimum: 1, nullable: true }
        balanceAmount: { type: string, nullable: true }
        pointsAmount: { type: integer, format: int64, nullable: true }
        validDays: { type: integer, minimum: 1, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }
    MemberPurchaseResult:
      type: object
      properties:
        account: { $ref: "#/components/schemas/MemberAccount" }
        card:
          allOf:
            - $ref: "#/components/schemas/MemberCardSummary"
          nullable: true
          description: TIMES 套餐生成的次卡，其余类型为空
        balanceAdded: { type: string }
        pointsAdded: { type: integer, format: int64 }
    MemberCard:
      type: object
      description: 会员次卡；扣次使用 remaining_times >= times 条件更新，并发不超扣。
      properties:
        id: { type: string, format: uuid }
        cardNo: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string, nullable: true }
        packageCode: { type: string }
        packageName: { type: string, nullable: true }
        totalTimes: { type: integer }
        usedTimes: { type: integer }
        remainingTimes: { type: integer }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, EXHAUSTED, EXPIRED, VOID] }
        sourceOrderId: { type: string, format: uuid, nullable: true }
    MemberCardUsage:
      type: object
      properties:
        id: { type: string, format: uuid }
        times: { type: integer }
        bizType: { type: string, nullable: true }
        bizNo: { type: string, nullable: true }
        status: { type: string, enum: [CONSUMED, REFUNDED] }
        remark: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        refundedAt: { type: string, format: date-time, nullable: true }
    MemberCardDetail:
      type: object
      properties:
        card: { $ref: "#/components/schemas/MemberCard" }
        usages:
          type: array
          items: { $ref: "#/components/schemas/MemberCardUsage" }
    MemberShare:
      type: object
      description: 会员权益共享授权；授权人与使用人不能为同一客户。
      properties:
        id: { type: string, format: uuid }
        ownerCustomerId: { type: string, format: uuid }
        ownerCustomerName: { type: string, nullable: true }
        beneficiaryCustomerId: { type: string, format: uuid }
        beneficiaryCustomerName: { type: string, nullable: true }
        resourceType: { type: string, enum: [BALANCE, POINTS, CARD] }
        resourceId: { type: string, format: uuid, nullable: true }
        canConsume: { type: boolean }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        createdAt: { type: string, format: date-time }
    OrderCreate:
      type: object
      required: [customerId, orderType, items]
      properties:
        customerId: { type: string, format: uuid }
        orderType: { type: string, maxLength: 32, description: "escort/home_service/package/recharge/other" }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/OrderItemCreate" }
        discountAmount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", nullable: true }
        idempotencyKey: { type: string, maxLength: 100, nullable: true }
        sourceChannel: { type: string, maxLength: 32, nullable: true }
    OrderItemCreate:
      type: object
      required: [itemCode, itemName, quantity, unitPrice]
      properties:
        itemCode: { type: string, maxLength: 40 }
        itemName: { type: string, maxLength: 120 }
        quantity: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,3})?$", description: "数量必须大于 0" }
        unitPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
    Order:
      type: object
      description: 统一订单摘要；金额由服务端按订单项重算，状态机 CREATED→PAID→COMPLETED，未支付可 CANCELLED，退款后 PARTIAL_REFUNDED/REFUNDED。
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string, nullable: true }
        orderType: { type: string }
        status: { type: string, enum: [CREATED, PAID, COMPLETED, CANCELLED, PARTIAL_REFUNDED, REFUNDED] }
        currency: { type: string }
        totalAmount: { type: string, description: "十进制金额字符串" }
        discountAmount: { type: string }
        payableAmount: { type: string }
        paidAmount: { type: string }
        refundedAmount: { type: string }
        sourceChannel: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        amount: { type: string }
    OrderDetail:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/Order" }
        cancelReason: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/Refund" }
    Payment:
      type: object
      description: 支付单；status PROCESSING/SUCCESS/FAILED/CLOSED，refundedAmount 为累计已退。
      properties:
        id: { type: string, format: uuid }
        paymentNo: { type: string }
        orderId: { type: string, format: uuid }
        orderNo: { type: string, nullable: true }
        channel: { type: string, enum: [wechat, alipay, bank, cash, other] }
        channelTradeNo: { type: string, nullable: true }
        amount: { type: string }
        refundedAmount: { type: string }
        status: { type: string, enum: [PROCESSING, SUCCESS, FAILED, CLOSED] }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    PaymentCallback:
      type: object
      required: [paymentNo, amount, success, signature]
      properties:
        paymentNo: { type: string }
        channelTradeNo: { type: string, nullable: true }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        success: { type: boolean }
        signature:
          type: string
          description: 'HMAC-SHA256(hex)，规范化串 "paymentNo=&amount=&success=&tradeNo="'
    PaymentCallbackResult:
      type: object
      properties:
        paymentNo: { type: string }
        status: { type: string, enum: [PROCESSING, SUCCESS, FAILED, CLOSED] }
        replayed: { type: boolean, description: "true 表示重复回调按幂等回放，未重复入账" }
    RefundApply:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        reason: { type: string, maxLength: 1000 }
    Refund:
      type: object
      description: 退款单；状态机 PENDING→APPROVED→SUCCESS，PENDING→REJECTED，执行失败为 FAILED。
      properties:
        id: { type: string, format: uuid }
        refundNo: { type: string }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: string }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, SUCCESS, FAILED] }
        channelRefundNo: { type: string, nullable: true }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        rejectReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ReconciliationBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchNo: { type: string }
        channel: { type: string }
        reconcileDate: { type: string, format: date }
        localCount: { type: integer }
        channelCount: { type: integer }
        localAmount: { type: string }
        channelAmount: { type: string }
        diffCount: { type: integer }
        status: { type: string, enum: [RUNNING, MATCHED, DIFF, FAILED] }
        runBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ReconciliationDiff:
      type: object
      properties:
        id: { type: string, format: uuid }
        diffType: { type: string, enum: [LOCAL_ONLY, CHANNEL_ONLY, AMOUNT_MISMATCH] }
        paymentNo: { type: string, nullable: true }
        channelTradeNo: { type: string, nullable: true }
        localAmount: { type: string, nullable: true }
        channelAmount: { type: string, nullable: true }
        handled: { type: boolean }
    ReconciliationDetail:
      type: object
      properties:
        batch: { $ref: "#/components/schemas/ReconciliationBatch" }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationDiff" }
    InvoiceApply:
      type: object
      required: [title, amount]
      properties:
        title: { type: string, maxLength: 200 }
        taxNo: { type: string, maxLength: 64, nullable: true }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        invoiceType: { type: string, enum: [general, special] }
    Invoice:
      type: object
      description: 发票流水；可开票净额 = 实付 − 已退，红冲后置 VOID 释放额度。
      properties:
        id: { type: string, format: uuid }
        invoiceNo: { type: string }
        orderId: { type: string, format: uuid }
        orderNo: { type: string, nullable: true }
        customerId: { type: string, format: uuid }
        title: { type: string }
        taxNo: { type: string, nullable: true }
        amount: { type: string }
        invoiceType: { type: string, enum: [general, special] }
        status: { type: string, enum: [APPLIED, ISSUED, VOID] }
        provider: { type: string, nullable: true }
        fileRef: { type: string, nullable: true }
        appliedBy: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 64 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 16 }
    TokenResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer, description: 访问令牌有效期（秒） }
            user: { $ref: "#/components/schemas/UserSession" }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
    UserSessionResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: "#/components/schemas/UserSession" }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
    UserSession:
      type: object
      properties:
