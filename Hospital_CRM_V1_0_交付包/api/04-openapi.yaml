          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [times]
              properties:
                times: { type: integer, minimum: 1 }
                usageId: { type: string, format: uuid, nullable: true }
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        "200":
          description: 返还成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MemberCard" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /memberships/shares:
