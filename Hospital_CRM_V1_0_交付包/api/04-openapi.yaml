          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HomeAddress" }
    post:
      tags: [HomeVisit]
      summary: 新增上门地址
      description: 客户必须存在；手机号以密文+哈希+脱敏三列存储。
      x-required-permission: crm:homevisit:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, address, contactName]
              properties:
                customerId: { type: string, format: uuid }
                address: { type: string, maxLength: 200 }
                contactName: { type: string, maxLength: 100 }
                contactPhone: { type: string, maxLength: 32 }
                isDefault: { type: boolean }
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeAddress" }
        "404": { $ref: "#/components/responses/NotFound" }
  /home-addresses/{addressId}:
    put:
      tags: [HomeVisit]
      summary: 更新上门地址
      description: 仅更新提交的字段；customerId 不可修改。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string, maxLength: 200 }
                contactName: { type: string, maxLength: 100 }
                contactPhone: { type: string, maxLength: 32 }
                isDefault: { type: boolean }
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeAddress" }
        "404": { $ref: "#/components/responses/NotFound" }
  /home-addresses/{addressId}/status:
    put:
      tags: [HomeVisit]
      summary: 启停上门地址
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeAddress" }
        "404": { $ref: "#/components/responses/NotFound" }
  /home-staff-qualifications:
    get:
      tags: [HomeVisit]
      summary: 上门服务人员资质分页查询
      x-required-permission: crm:homevisit:read
      parameters:
        - in: query
          name: userId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: qualType
          required: false
          schema: { type: string, enum: [nurse, caregiver, health_manager, doctor, other] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HomeStaffQualification" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
    post:
      tags: [HomeVisit]
      summary: 登记上门服务人员资质
      description: 同一人员同类型同证书编号唯一；签发日期不得晚于到期日期。
      x-required-permission: crm:homevisit:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, qualType, certNo, issuedAt]
              properties:
                userId: { type: string, format: uuid }
                qualType: { type: string, enum: [nurse, caregiver, health_manager, doctor, other] }
                certNo: { type: string, maxLength: 64 }
                issuedAt: { type: string, format: date }
                expiresAt: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: 登记成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeStaffQualification" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-staff-qualifications/{staffQualificationId}/revoke:
    put:
      tags: [HomeVisit]
      summary: 停用上门服务人员资质
      description: 已停用的资质重复停用返回 422。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/StaffQualificationId"
      responses:
        "200":
          description: 停用成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeStaffQualification" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders:
    get:
      tags: [HomeVisit]
      summary: 上门服务订单分页查询
      x-required-permission: crm:homevisit:read
      parameters:
        - in: query
          name: keyword
          required: false
          schema: { type: string }
          description: 订单号模糊匹配
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, ASSIGNED, ACCEPTED, IN_PROGRESS, COMPLETED, CANCELLED] }
        - in: query
          name: serviceCode
          required: false
          schema: { type: string }
        - in: query
          name: customerId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: staffUserId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: dateFrom
          required: false
          schema: { type: string, format: date }
        - in: query
          name: dateTo
          required: false
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HomeVisitOrder" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
    post:
      tags: [HomeVisit]
      summary: 创建上门服务订单
      description: 服务必须已发布；地址必须属于该客户且启用；服务日期不得早于今天。
      x-required-permission: crm:homevisit:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceCode, customerId, addressId, scheduledDate, startTime, endTime]
              properties:
                serviceCode: { type: string, maxLength: 64 }
                customerId: { type: string, format: uuid }
                addressId: { type: string, format: uuid }
                scheduledDate: { type: string, format: date }
                startTime: { type: string, format: "HH:mm" }
                endTime: { type: string, format: "HH:mm" }
                remark: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}:
    get:
      tags: [HomeVisit]
      summary: 上门服务订单详情
      description: 含地址快照、执行记录与异常列表。
      x-required-permission: crm:homevisit:read
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /home-visit-orders/{orderId}/review:
    put:
      tags: [HomeVisit]
      summary: 审核上门服务订单
      description: 仅 PENDING 可审核；approved=false 转 REJECTED 并记录原因。
      x-required-permission: crm:homevisit:manage
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/dispatch:
    put:
      tags: [HomeVisit]
      summary: 上门服务派单
      description: 人员须存在有效资质且资质类型满足服务要求。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffUserId]
              properties:
                staffUserId: { type: string, format: uuid }
      responses:
        "200":
          description: 派单成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/accept:
    put:
      tags: [HomeVisit]
      summary: 上门服务人员接单
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      responses:
        "200":
          description: 接单成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/reject:
    put:
      tags: [HomeVisit]
      summary: 上门服务人员拒单
      description: 订单回退待派单状态并保留拒绝原因。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/start:
    put:
      tags: [HomeVisit]
      summary: 开始上门服务
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/executions:
    post:
      tags: [HomeVisit]
      summary: 记录上门服务执行内容
      description: 仅 IN_PROGRESS 状态可记录。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 1000 }
                visitAt: { type: string, format: date-time }
      responses:
        "200":
          description: 记录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitExecution" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/exceptions:
    post:
      tags: [HomeVisit]
      summary: 上报上门服务异常
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, category, description]
              properties:
                level: { type: string, enum: [low, medium, high, critical] }
                category: { type: string, enum: [vital_sign, equipment, patient_condition, staff_safety, other] }
                description: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 上报成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitException" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/finish:
    put:
      tags: [HomeVisit]
      summary: 完成上门服务
      description: 记录实际结束时间与时长（分钟，四舍五入），备注追加到订单。
      x-required-permission: crm:homevisit:write
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-orders/{orderId}/cancel:
    put:
      tags: [HomeVisit]
      summary: 取消上门服务订单
      description: 服务已开始需走完成流程。
      x-required-permission: crm:homevisit:manage
      parameters:
        - $ref: "#/components/parameters/HomeVisitOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-exceptions:
    get:
      tags: [HomeVisit]
      summary: 上门服务异常分页查询
      x-required-permission: crm:homevisit:read
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [OPEN, ESCALATED, RESOLVED] }
        - in: query
          name: level
          required: false
          schema: { type: string, enum: [low, medium, high, critical] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HomeVisitException" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, format: int64 }
  /home-visit-exceptions/{exceptionId}/escalate:
    put:
      tags: [HomeVisit]
      summary: 升级上门服务异常
      description: 仅 OPEN 状态可升级。
      x-required-permission: crm:homevisit:manage
      parameters:
        - $ref: "#/components/parameters/ExceptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitException" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }
  /home-visit-exceptions/{exceptionId}/resolve:
    put:
      tags: [HomeVisit]
      summary: 处置完成上门服务异常
      description: 已处置完成的异常重复处置返回 422。
      x-required-permission: crm:homevisit:manage
      parameters:
        - $ref: "#/components/parameters/ExceptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HomeVisitException" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleFailed" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CustomerId:
      in: path
      name: customerId
      required: true
      schema: { type: string, format: uuid }
    FamilyId:
      in: path
      name: familyId
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      in: path
      name: memberId
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      in: path
      name: channelId
      required: true
      schema: { type: string, format: uuid }
    LeadId:
      in: path
      name: leadId
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string, format: uuid }
    ActivityId:
      in: path
      name: activityId
      required: true
      schema: { type: string, format: uuid }
    ParticipantId:
      in: path
      name: participantId
      required: true
      schema: { type: string, format: uuid }
    TypeCode:
      in: path
      name: typeCode
      required: true
      schema: { type: string }
    SlotId:
      in: path
      name: slotId
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      in: path
      name: appointmentId
      required: true
      schema: { type: string, format: uuid }
    ReminderId:
      in: path
      name: reminderId
      required: true
      schema: { type: string, format: uuid }
    EscortId:
      in: path
      name: escortId
      required: true
      schema: { type: string, format: uuid }
    QualificationId:
      in: path
      name: qualificationId
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      in: path
      name: scheduleId
      required: true
      schema: { type: string, format: uuid }
    EscortOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    ServiceCode:
      in: path
      name: serviceCode
      required: true
      schema: { type: string }
    AddressId:
      in: path
      name: addressId
      required: true
      schema: { type: string, format: uuid }
    StaffQualificationId:
      in: path
      name: staffQualificationId
      required: true
      schema: { type: string, format: uuid }
    HomeVisitOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      in: path
      name: exceptionId
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    Conflict:
      description: 状态冲突或重复请求
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamError:
      description: 上游HIS或第三方服务错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BusinessRuleFailed:
      description: 业务规则不满足
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 未认证或登录已过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 权限不足或超出数据范围
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: HIS未配置、只读账号校验失败或服务熔断
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: 请求参数校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object, additionalProperties: true } }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
    CustomerCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        gender: { type: string, enum: [unknown, male, female, other] }
        birthDate: { type: string, format: date }
        mobile: { type: string, description: "服务端加密存储并生成检索hash" }
        identityNo: { type: string, description: "敏感字段，服务端加密处理" }
        sourceCode: { type: string }
    CustomerResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
