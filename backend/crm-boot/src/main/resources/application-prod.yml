server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.hospital.crm: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

crm:
  security:
    jwt:
      signing-key: ${CRM_JWT_SIGNING_KEY}
    bootstrap-admin:
      password: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:}
    data-encryption:
      key: ${CRM_DATA_ENCRYPTION_KEY}
